name: Release

# Triggered by a version tag (`git tag v1.0.0 && git push origin v1.0.0`,
# see docs/publicacion.md). Builds the release binary and both
# distributable packages directly on the ubuntu-22.04 runner (it already
# is the same Ubuntu 22.04 / glibc 2.35 that packaging/docker/Dockerfile.build
# pins for local builds, so this does not need Docker — D9, §7.2), verifies
# them in clean containers with the existing packaging/verify.sh, and
# leaves a DRAFT GitHub release with the four files attached. Nothing is
# published automatically: the author reviews the draft and clicks
# "Publish release" (D17, docs/publicacion.md step 9).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches [workspace.package] version
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$tag" != "$version" ]; then
            echo "::error::el tag $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Free disk space (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install build dependencies (packaging/docker/Dockerfile.build, plus cargo-deb's own deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev \
            dpkg-dev fakeroot

      - name: rustup show (applies rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install packaging tools (D17, fixed versions, --locked)
        run: |
          cargo install --locked --version 3.8.0 cargo-deb
          cargo install --locked --version 0.9.2 cargo-about --features cli

      - name: cargo build --release -p cincel
        run: cargo build --release -p cincel

      - name: cargo about generate (THIRD-PARTY-LICENSES.html, D19)
        run: |
          cargo about generate \
            --config packaging/about.toml \
            --manifest-path crates/cincel/Cargo.toml \
            packaging/about.hbs \
            -o target/release/THIRD-PARTY-LICENSES.html

      - name: cargo deb (the generic maintainer already in crates/cincel/Cargo.toml; packaging/README.md)
        run: |
          mkdir -p dist
          cargo deb -p cincel --no-strip -o "dist/cincel_${{ steps.version.outputs.version }}-1_amd64.deb"

      - name: Assemble the tarball (§6.1, same layout as packaging/build.sh)
        run: |
          set -eu
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="cincel-$VERSION-x86_64-linux"
          STAGE_DIR="target/stage/$PKG_NAME"
          rm -rf "$STAGE_DIR"
          mkdir -p \
            "$STAGE_DIR/bin" \
            "$STAGE_DIR/share/applications" \
            "$STAGE_DIR/share/icons/hicolor/scalable/apps" \
            "$STAGE_DIR/share/doc/cincel"
          for size in 16x16 32x32 48x48 64x64 128x128 256x256 512x512; do
            mkdir -p "$STAGE_DIR/share/icons/hicolor/$size/apps"
            cp "packaging/icons/png/$size/apps/dev.cincel.Cincel.png" \
              "$STAGE_DIR/share/icons/hicolor/$size/apps/dev.cincel.Cincel.png"
          done
          install -m 0755 packaging/install.sh "$STAGE_DIR/install.sh"
          install -m 0755 target/release/cincel "$STAGE_DIR/bin/cincel"
          install -m 0644 packaging/linux/dev.cincel.Cincel.desktop \
            "$STAGE_DIR/share/applications/dev.cincel.Cincel.desktop"
          install -m 0644 packaging/icons/dev.cincel.Cincel.svg \
            "$STAGE_DIR/share/icons/hicolor/scalable/apps/dev.cincel.Cincel.svg"
          install -m 0644 LICENSE "$STAGE_DIR/share/doc/cincel/LICENSE"
          install -m 0644 CHANGELOG.md "$STAGE_DIR/share/doc/cincel/CHANGELOG.md"
          install -m 0644 target/release/THIRD-PARTY-LICENSES.html \
            "$STAGE_DIR/share/doc/cincel/THIRD-PARTY-LICENSES.html"
          install -m 0644 crates/cincel-workspace/assets/fonts/inter/OFL.txt \
            "$STAGE_DIR/share/doc/cincel/OFL-Inter.txt"
          install -m 0644 crates/cincel-workspace/assets/fonts/jetbrains-mono/OFL.txt \
            "$STAGE_DIR/share/doc/cincel/OFL-JetBrainsMono.txt"
          (cd target/stage && tar --numeric-owner --owner=0 --group=0 \
            -czf "../dist/$PKG_NAME.tar.gz" "$PKG_NAME")

      - name: Checksums
        run: |
          cd dist
          for f in *.tar.gz *.deb; do
            sha256sum "$f" >"$f.sha256"
          done
          ls -la .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  verify:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: packaging/verify.sh (ubuntu:22.04 and ubuntu:24.04, §6.6)
        run: packaging/verify.sh dist

  draft-release:
    needs: [build, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Extract this version's CHANGELOG.md section
        run: |
          awk -v v="${{ needs.build.outputs.version }}" '
            BEGIN { printing = 0 }
            /^## \[/ {
              if (printing) exit
              if ($0 ~ "^## \\[" v "\\]") { printing = 1; next }
            }
            printing { print }
          ' CHANGELOG.md >release-notes.md
      - name: Create the draft release (the author publishes it by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Cincel ${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            dist/*.deb \
            dist/*.deb.sha256
