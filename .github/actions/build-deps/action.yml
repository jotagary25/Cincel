name: Build dependencies
description: >-
  Frees disk on the runner and installs the system libraries every workflow
  needs to compile the GPUI crates (cincel-editor, cincel-chat,
  cincel-workspace, cincel). Single source of truth: the same list as
  packaging/docker/Dockerfile.build. Any job that compiles those crates must
  call this action right after actions/checkout.

inputs:
  extra-packages:
    description: Extra apt packages a workflow needs on top of the common set (space separated).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Free disk space (unused preinstalled toolchains)
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
    - name: Install build dependencies (same set as packaging/docker/Dockerfile.build)
      shell: bash
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086  # extra-packages is a deliberate word list
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config \
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
          libvulkan-dev libfontconfig-dev \
          ${{ inputs.extra-packages }}
