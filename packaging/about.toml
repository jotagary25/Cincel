# Config for `cargo about generate` (D19): builds
# `THIRD-PARTY-LICENSES.html` at release time from the same set of accepted
# licenses as `deny.toml` (D8: the licenses of the embedded fonts are not
# crates, so `cargo about` does not see them either; their OFL texts travel
# as separate files, `share/doc/cincel/OFL-*.txt`).
#
# Run from the repository root:
#   cargo about generate --config packaging/about.toml \
#       --manifest-path crates/cincel/Cargo.toml \
#       packaging/about.hbs -o dist/THIRD-PARTY-LICENSES.html
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MIT-0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
