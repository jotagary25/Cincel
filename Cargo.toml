[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
# D22: `jotagary25` is a placeholder the author replaces once the
# repository is created (docs/publicacion.md, step 5) — never guessed or
# filled in ahead of time.
repository = "https://github.com/jotagary25/cincel"
homepage = "https://github.com/jotagary25/cincel"
description = "Code editor where you review every change an AI agent makes"

[workspace.dependencies]
# UI (fijadas al par que exige gpui-kit 0.6.1)
gpui = { package = "gpui-pre", version = "=0.3.5" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.5", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-kit = "=0.6.1"
# agentes
agent-client-protocol = "2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
async-channel = "2"
futures = "0.3"
# texto y sintaxis
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
imara-diff = "0.2"
similar = "3"
# proyecto
notify = "8"
ignore = "0.4"
# utilidades
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
sha2 = "0.10"
dirs = "6"

# ACP (agregado por cincel-acp, E0-b)
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
tokio-util = { version = "0.7", features = ["compat"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"

# proyecto y ajustes (agregados por cincel-project/cincel-settings, E1-B)
jsonc-parser = { version = "0.33", features = ["serde", "cst"] }
globset = "0.4"

# editor (agregado por cincel-editor, E1-C): búsqueda con regex opcional
regex = "1"

# workspace (agregado por cincel-workspace, E1-D): diálogo de carpeta por portal xdg
rfd = "0.17"

# acp: distribuciones binary/uvx (agregado por cincel-acp, E2)
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# conexiones (agregado por cincel-connections, E4-B): login en pty, runtime
# Node privado (tar.xz) e ids de conexión
portable-pty = "0.9"
lzma-rs = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

# buscador de archivos (agregado por cincel-workspace, E5-F): coincidencia
# difusa con posiciones para resaltar (D1)
frizbee = "0.13"

[workspace.lints.rust]
unsafe_code = "warn"
[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
# D11: the profile no longer generates its own debug info; what the
# standard library brings along only adds size. Function names (for a
# readable backtrace) are kept; only line-number tables and the rest of
# DWARF go.
strip = "debuginfo"
