[package]
name = "cincel"
description = "Code editor where you review every change an AI agent makes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cincel"
path = "src/main.rs"

# `.deb` metadata (`docs/specs/08-etapa6-cierre-1-0.md` §6.3). `maintainer`
# is a generic, non-personal default: `packaging/build.sh` overrides it at
# build time from `CINCEL_MAINTAINER` or `packaging/maintainer.txt` (both
# outside the repo history, see `packaging/README.md`) and restores this
# file afterwards, so no real address is ever committed.
[package.metadata.deb]
name = "cincel"
maintainer = "Cincel contributors <cincel@users.noreply.github.com>"
section = "editors"
priority = "optional"
depends = "$auto"
recommends = "git, xdg-desktop-portal, mesa-vulkan-drivers"
extended-description = """\
Cincel is a minimalist code editor for Linux, built in Rust on Zed's \
graphics engine (GPUI), with a chat panel for AI coding agents (Claude \
Code, Codex, Google Antigravity, OpenCode and any ACP-compatible agent) \
using your own subscriptions. Every change an agent makes is shown inline, \
segment by segment, for you to accept or reject before it lands."""
changelog = "../../CHANGELOG.md"
revision = "1"
assets = [
    { source = "target/release/cincel", dest = "usr/bin/cincel", mode = "755" },
    { source = "../../packaging/linux/dev.cincel.Cincel.desktop", dest = "usr/share/applications/dev.cincel.Cincel.desktop", mode = "644" },
    { source = "../../packaging/icons/dev.cincel.Cincel.svg", dest = "usr/share/icons/hicolor/scalable/apps/dev.cincel.Cincel.svg", mode = "644" },
    { source = "../../packaging/icons/png/16x16/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/16x16/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../packaging/icons/png/32x32/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/32x32/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../packaging/icons/png/48x48/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/48x48/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../packaging/icons/png/64x64/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/64x64/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../packaging/icons/png/128x128/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/128x128/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../packaging/icons/png/256x256/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/256x256/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../packaging/icons/png/512x512/apps/dev.cincel.Cincel.png", dest = "usr/share/icons/hicolor/512x512/apps/dev.cincel.Cincel.png", mode = "644" },
    { source = "../../LICENSE", dest = "usr/share/doc/cincel/LICENSE", mode = "644" },
    { source = "../../target/ubuntu-22.04/THIRD-PARTY-LICENSES.html", dest = "usr/share/doc/cincel/THIRD-PARTY-LICENSES.html", mode = "644" },
    { source = "../cincel-workspace/assets/fonts/inter/OFL.txt", dest = "usr/share/doc/cincel/OFL-Inter.txt", mode = "644" },
    { source = "../cincel-workspace/assets/fonts/jetbrains-mono/OFL.txt", dest = "usr/share/doc/cincel/OFL-JetBrainsMono.txt", mode = "644" },
]

[dependencies]
cincel-log = { path = "../cincel-log" }
cincel-settings = { path = "../cincel-settings" }
cincel-workspace = { path = "../cincel-workspace" }
gpui-kit = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
