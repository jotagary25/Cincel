[package]
name = "asteroid-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
asteroid-text = { path = "../asteroid-text" }
ropey = { workspace = true }
tree-sitter = { workspace = true }

# Grammars. All from crates.io, all MIT, all depending only on
# `tree-sitter-language` 0.1 so no `[patch.crates-io]` is needed.
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
# `tree-sitter-md` and `tree-sitter-dockerfile` still take a *normal* dependency
# on an older `tree-sitter` (0.26 and 0.20), which would pull a second copy of
# the C runtime into the link. The `arborium-*` re-packagings of the very same
# grammars depend only on `tree-sitter-language`, so they are used instead.
arborium-markdown = { version = "2.18", optional = true }
arborium-dockerfile = { version = "2.18", optional = true }

[features]
default = [
    "bash",
    "c",
    "cpp",
    "css",
    "dockerfile",
    "go",
    "html",
    "java",
    "javascript",
    "json",
    "markdown",
    "python",
    "rust",
    "sql",
    "toml",
    "tsx",
    "typescript",
    "yaml",
]
bash = ["dep:tree-sitter-bash"]
c = ["dep:tree-sitter-c"]
cpp = ["dep:tree-sitter-cpp"]
css = ["dep:tree-sitter-css"]
dockerfile = ["dep:arborium-dockerfile"]
go = ["dep:tree-sitter-go"]
html = ["dep:tree-sitter-html"]
java = ["dep:tree-sitter-java"]
javascript = ["dep:tree-sitter-javascript"]
json = ["dep:tree-sitter-json"]
markdown = ["dep:arborium-markdown"]
python = ["dep:tree-sitter-python"]
rust = ["dep:tree-sitter-rust"]
sql = ["dep:tree-sitter-sequel"]
toml = ["dep:tree-sitter-toml-ng"]
# The TypeScript and TSX grammars reuse the JavaScript highlight queries.
tsx = ["dep:tree-sitter-typescript", "javascript"]
typescript = ["dep:tree-sitter-typescript", "javascript"]
yaml = ["dep:tree-sitter-yaml"]

[lints]
workspace = true
