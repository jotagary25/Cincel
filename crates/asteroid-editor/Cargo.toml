[package]
name = "asteroid-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autoexamples = false

[dependencies]
asteroid-text = { path = "../asteroid-text" }
asteroid-syntax = { path = "../asteroid-syntax" }
gpui = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
# Only to walk the tree `asteroid-syntax` hands out (`SyntaxState::tree`) when
# resolving the symbol under the cursor; the same workspace pin, so the `Tree`
# and `Node` types are the ones that crate produces.
tree-sitter = { workspace = true }

[dev-dependencies]
gpui_platform = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Enables gpui's test harness (`cargo test -p asteroid-editor --features test-support`).
# It is not on by default because it also turns on gpui leak detection, which
# aborts the example window on exit.
test-support = ["gpui/test-support"]

[[example]]
name = "phantom"
path = "examples/phantom.rs"

[lints]
workspace = true
