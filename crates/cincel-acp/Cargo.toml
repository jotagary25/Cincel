[package]
name = "cincel-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
# `tests/fake_agent/` is a helper binary, not an integration test.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

# Test helper: a real ACP agent over stdio. Built as a bin so integration tests
# can find it through CARGO_BIN_EXE_cincel-acp-fake-agent.
[[bin]]
name = "cincel-acp-fake-agent"
path = "tests/fake_agent/main.rs"

[features]
# ACP v2 spike (spec 06 §5.8): declared, never enabled by default. Cincel
# speaks ACP v1 only.
acp-v2-spike = ["agent-client-protocol/unstable_protocol_v2"]

[dependencies]
agent-client-protocol.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util.workspace = true
async-channel.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs.workspace = true
ureq.workspace = true
sha2.workspace = true
globset.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
